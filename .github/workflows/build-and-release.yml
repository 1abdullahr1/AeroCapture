name: Build & Package AeroCapture Installer

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Installer & Portable Package
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install Inno Setup
        run: |
          choco install innosetup -y --no-progress

      - name: Download & Extract Static FFmpeg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "temp_ffmpeg" | Out-Null
          New-Item -ItemType Directory -Force -Path "dist\app\ffmpeg" | Out-Null
          
          $urls = @(
              "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip",
              "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          )
          
          $downloaded = $false
          $zipPath = "temp_ffmpeg\ffmpeg.zip"

          foreach ($url in $urls) {
              try {
                  Write-Host "Attempting download from: $url"
                  Invoke-WebRequest -Uri $url -OutFile $zipPath -UserAgent "AeroCapture-CI" -TimeoutSec 300
                  $downloaded = $true
                  Write-Host "Download successful!"
                  break
              } catch {
                  Write-Warning "Failed to download from $url : $_"
              }
          }

          if (-not $downloaded) {
              Write-Error "Could not download FFmpeg from any source."
              exit 1
          }

          Write-Host "Extracting FFmpeg..."
          Expand-Archive -Path $zipPath -DestinationPath "temp_ffmpeg\extracted" -Force
          
          $ffmpegExe = Get-ChildItem -Path "temp_ffmpeg\extracted" -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
          if ($ffmpegExe) {
              Copy-Item $ffmpegExe.FullName -Destination "dist\app\ffmpeg\ffmpeg.exe" -Force
              Write-Host "FFmpeg successfully copied to dist\app\ffmpeg\ffmpeg.exe"
          } else {
              Write-Error "Failed to locate ffmpeg.exe in extracted archive!"
              exit 1
          }

      - name: Publish WinUI 3 Unpackaged Application (Self-Contained x64)
        shell: pwsh
        run: |
          $repoRoot = (Get-Item .).FullName
          $publishDir = Join-Path $repoRoot "dist\app"

          msbuild src/AeroCapture/AeroCapture.csproj `
            /restore `
            /t:Publish `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:RuntimeIdentifier=win-x64 `
            /p:SelfContained=true `
            /p:WindowsPackageType=None `
            /p:PublishDir="$publishDir\"

      - name: Verify Bundle Resources, PRI Files, and FFmpeg
        shell: pwsh
        run: |
          $repoRoot = (Get-Item .).FullName
          $appDir = Join-Path $repoRoot "dist\app"

          # 1. Ensure FFmpeg is present
          if (-not (Test-Path "$appDir\ffmpeg\ffmpeg.exe")) {
              Write-Host "Copying FFmpeg to bundle..."
              New-Item -ItemType Directory -Force -Path "$appDir\ffmpeg" | Out-Null
              $ffmpegExe = Get-ChildItem -Path "temp_ffmpeg\extracted" -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
              Copy-Item $ffmpegExe.FullName -Destination "$appDir\ffmpeg\ffmpeg.exe" -Force
          }

          # 2. Ensure resources.pri is present
          Write-Host "Checking PRI files in $appDir..."
          if (-not (Test-Path "$appDir\resources.pri")) {
              Write-Host "resources.pri not found in dist\app! Searching project outputs..."
              $priFiles = Get-ChildItem -Path "src\AeroCapture\bin" -Filter "*AeroCapture.pri" -Recurse
              if (-not $priFiles) {
                  $priFiles = Get-ChildItem -Path "src\AeroCapture" -Filter "*.pri" -Recurse
              }

              foreach ($p in $priFiles) {
                  Write-Host "Found PRI: $($p.FullName)"
                  if ($p.Name -like "*AeroCapture.pri") {
                      Copy-Item $p.FullName -Destination "$appDir\resources.pri" -Force
                      Copy-Item $p.FullName -Destination "$appDir\AeroCapture.pri" -Force
                      Write-Host "Successfully copied $($p.Name) as resources.pri and AeroCapture.pri!"
                  }
              }
          }

          # Verify all PRI files in dist\app
          Write-Host "Final list of PRI files in output bundle:"
          Get-ChildItem -Path $appDir -Filter "*.pri" | Format-Table Name, Length, LastWriteTime

      - name: Compile Inno Setup Windows Installer
        shell: pwsh
        run: |
          $version = "1.0.0"
          if ($env:GITHUB_REF -like "refs/tags/v*") {
              $version = $env:GITHUB_REF.Substring(11)
          }

          $repoRoot = (Get-Item .).FullName
          $sourceDir = Join-Path $repoRoot "dist\app"
          $outputDir = Join-Path $repoRoot "dist\installer"
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
          
          Write-Host "Compiling installer for version $version..."
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$version" `
            "/DSourceDir=$sourceDir" `
            "/DOutputDir=$outputDir" `
            installer\setup.iss

      - name: Package Portable ZIP Release
        shell: pwsh
        run: |
          $version = "1.0.0"
          if ($env:GITHUB_REF -like "refs/tags/v*") {
              $version = $env:GITHUB_REF.Substring(11)
          }
          Compress-Archive -Path "dist\app\*" -DestinationPath "dist\installer\AeroCapture-Portable-v$version-win-x64.zip" -Force
          Write-Host "Artifacts generated in dist\installer:"
          Get-ChildItem "dist\installer"

      - name: Upload Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AeroCapture-Windows-Installer
          path: dist/installer/*
          retention-days: 30

      - name: Create GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/installer/*
          generate_release_notes: true
          draft: false
          prerelease: false
